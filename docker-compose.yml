services:
  chat-sql:
    image: mcr.microsoft.com/mssql/server:2025-CU6-ubuntu-24.04
    platform: linux/amd64
    container_name: chat-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in a local .env file, see .env.example}"
      MSSQL_PID: "Developer"
    ports: ["14330:1433"]
    volumes: ["chat-sql-data:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12
volumes:
  chat-sql-data: